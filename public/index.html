<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice Shop · Login Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <span class="brand">
      <img class="logo" src="/favicon.svg" width="34" height="34" alt="">
      <span class="wordmark">Juice <span class="wordmark-accent">Shop</span></span>
    </span>
    <span class="lab">LOGIN LAB</span>
  </header>
  <main>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">WELCOME BACK</p>
      <div class="title-row">
        <h1 id="title">Login</h1>
        <button id="info-button" class="icon-button info-button" type="button" aria-expanded="false" aria-controls="demo-info" aria-label="Demo account credentials">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="intro">Sign in to your account.</p>
      <div id="demo-info" class="demo-info" hidden>
        <p class="demo-title">Demo account</p>
        <dl>
          <dt>Email</dt><dd>student@example.com</dd>
          <dt>Password</dt><dd>JuiceShopDemo123!</dd>
        </dl>
      </div>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="text" inputmode="email" autocomplete="username" placeholder="you@example.com" maxlength="254" required>
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" maxlength="128" required>
          <button id="password-toggle" class="icon-button password-toggle" type="button" aria-pressed="false" aria-controls="password" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.6 3.5M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.6 5-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="login-button" class="primary-button" type="submit">Log in</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="footer">A classroom security lab inspired by OWASP Juice Shop.</p>
  </main>
  <dialog id="success-dialog" class="success-dialog" aria-labelledby="success-title" aria-describedby="success-text">
    <div class="success-body">
      <div class="success-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 id="success-title">Login successful</h2>
      <p id="success-text">Welcome back, <strong id="success-email"></strong>. The server validated your credentials.</p>
      <button id="success-close" class="primary-button" type="button">Continue</button>
    </div>
  </dialog>
</body>
</html>
